name: Bug report
description: Report a reproducible problem with WebMusic.
body:
  - type: markdown
    attributes:
      value: For security issues, follow SECURITY.md instead of posting sensitive details here.
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include a minimal example, import paths, and steps.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Package versions, ESM or CommonJS, framework/bundler, browser, OS, and Node version.
    validations:
      required: true
