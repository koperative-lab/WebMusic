version: 2
updates:
  # One grouped PR per ecosystem per month, minor and patch releases only.
  # Major upgrades need manual migration and are not proposed. Security
  # updates are not limited by this schedule and still open when an advisory
  # applies.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    groups:
      npm-dependencies:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    groups:
      github-actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
