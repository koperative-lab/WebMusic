version: 2
updates:
  # One grouped PR per ecosystem per month, minor and patch releases only.
  # Major upgrades need manual migration and are not proposed. Security
  # updates are not limited by this schedule and still open when an advisory
  # applies.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
      # Prebundled site dependencies need a license provenance review before
      # each version change (scripts/licenses/site/README.md), so they are
      # upgraded manually.
      - dependency-name: opensheetmusicdisplay
      - dependency-name: spessasynth_lib
      - dependency-name: spessasynth_core
      - dependency-name: vexflow
      # Current Astro releases (astro 7.4, @astrojs/mdx 8.1, @astrojs/prism
      # 4.1) require Node >=22.23.4, above the supported ^22.22.3 floor. Raise
      # the floor before upgrading them.
      - dependency-name: astro
      - dependency-name: '@astrojs/*'
    groups:
      npm-dependencies:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    groups:
      github-actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
